services:
  - type: web
    name: careerstudiomax-api-platform
    runtime: node
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    # 2026-09-16 (Developer Cloud hardening PASS 3): this repo now has a
    # real CI gate (.github/workflows/ci.yml) -- a syntax-check + the full
    # test suite (security/billing/idempotency/graceful-shutdown/env-
    # validation) + a real startup smoke test must all succeed before the
    # workflow's own `deploy` job calls Render's deploy hook. Flipped to
    # false to match: plain push-to-deploy is no longer the right default
    # now that something real exists to gate on.
    #
    # IMPORTANT — this Blueprint value alone is NOT sufficient. The same
    # class of gap cs_fixed's own render.yaml documents for its two
    # services applies here too: Render does not reliably propagate a
    # render.yaml change to an ALREADY-CREATED live service's own
    # dashboard Auto-Deploy toggle. A one-time manual step is still
    # required: this service's Render dashboard -> Settings -> Build &
    # Deploy -> Auto-Deploy -> Off. Until that's done, a push to master
    # may still deploy immediately via the live service's own current
    # setting, wholly independent of this file and of the new CI
    # workflow's result.
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      # developer-portal's Cloudflare Pages deploy + wherever else this
      # API is called from (curl, SDKs, etc.)
      - key: ALLOWED_ORIGINS
        value: https://dev.careerstudiomax.com,https://careerstudiomax.com
      # developer-portal's own deployed URL — used in welcome emails and
      # error messages that point developers back to the pricing page.
      - key: PORTAL_URL
        value: https://dev.careerstudiomax.com

      # ── Database ─────────────────────────────────────────────────
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: careerlm_api

      # ── CareerCamp AI Gateway (internal proxy target) ──────────────
      # MUST point to careercamp-ai's own deployed Render URL, not
      # localhost:3002 — that only resolves on whichever single machine
      # is running this service locally. See cs_fixed/render.yaml's own
      # CAREERCAMP_BASE_URL comment: deploy careercamp-ai as its own
      # Render service first (it has its own render.yaml), then set this
      # to its live URL.
      - key: CAREERCAMP_URL
        sync: false
      - key: CS_TRANSFORMER_API_KEY
        sync: false

      # ── Email (developer API key delivery) ──────────────────────────
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        value: CareerStudioMax Developer Cloud <api@careerstudiomax.com>

      # ── Stripe (paid developer tiers) ────────────────────────────────
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_PRICE_PRO
        sync: false
      - key: STRIPE_PRICE_PLUS
        sync: false
      - key: STRIPE_PRICE_ENTERPRISE
        sync: false
      # Signing secret for the Stripe webhook endpoint (routes/stripeWebhook.js,
      # POST /v1/developer/stripe/webhook) -- 2026-09-16 hardening pass.
      # Get the real value from the Stripe Dashboard -> Developers ->
      # Webhooks -> (this endpoint) -> Signing secret, and set it directly
      # in Render's dashboard. Never commit the real value anywhere.
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
